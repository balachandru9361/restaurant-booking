{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>Welcome - Chandru Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#07101f; --navy:#0e1c38; --gold:#f2b53f; --gold-hi:#ffe3a0; --brass:#b9812a; --cream:#fff6e2; --coral:#ff6b4a;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--ink); color:#fff; font-family:'Poppins', sans-serif; }

  .stage {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    background:
      radial-gradient(ellipse at 50% 28%, #213e75 0%, rgba(33,62,117,0) 55%),
      radial-gradient(ellipse at 50% 110%, rgba(255,107,74,.22) 0%, rgba(255,107,74,0) 55%),
      linear-gradient(180deg, #0b1830 0%, var(--ink) 100%);
    transition:opacity .35s ease, transform .35s ease, filter .35s ease;
    cursor:pointer;
  }
  .stage.leave { opacity:0; transform:scale(1.08); filter:blur(5px) brightness(1.4); }

  /* soft table-cloth light from below + vignette */
  .glow { position:absolute; left:50%; bottom:-30%; width:140%; height:60%; transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(242,181,63,.28), rgba(242,181,63,0) 65%); pointer-events:none; }
  .vig { position:absolute; inset:0; pointer-events:none; z-index:6;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55) 100%); }
  canvas#fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }

  /* ---------- logo medallion ---------- */
  .medal { position:relative; width:168px; height:168px; z-index:4; flex:none; }
  .medal svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .ring-draw { fill:none; stroke:var(--gold); stroke-width:2.5; stroke-linecap:round;
    stroke-dasharray:452; stroke-dashoffset:452; transform:rotate(-90deg); transform-origin:50% 50%;
    filter:drop-shadow(0 0 8px rgba(242,181,63,.8)); animation:draw 1s cubic-bezier(.6,0,.2,1) .15s forwards; }
  .ring-dash { fill:none; stroke:rgba(255,227,160,.45); stroke-width:1.2; stroke-dasharray:2 9; stroke-linecap:round;
    transform-origin:50% 50%; opacity:0; animation:fade .5s ease .9s forwards, spin 28s linear .9s infinite; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes fade { to { opacity:1; } }

  .logo { position:absolute; inset:21px; border-radius:50%; opacity:0; transform:scale(.4);
    animation:pop .7s cubic-bezier(.2,1.5,.35,1) .45s forwards; }
  .logo img { width:100%; height:100%; border-radius:50%; object-fit:cover; background:#fff; display:block;
    box-shadow:0 0 0 4px rgba(7,16,31,.9), 0 0 40px rgba(242,181,63,.65), 0 14px 30px rgba(0,0,0,.5); }
  .logo.nologo { display:grid; place-items:center; background:radial-gradient(circle at 35% 30%, #fff, #f3e3bd);
    font-size:54px; box-shadow:0 0 0 4px rgba(7,16,31,.9), 0 0 40px rgba(242,181,63,.65), 0 14px 30px rgba(0,0,0,.5); }
  .logo.nologo::before { content:'\1F37D\FE0F'; }
  @keyframes pop { to { opacity:1; transform:scale(1); } }

  /* steam rising from the medallion */
  .steam { position:absolute; left:50%; bottom:78%; width:46px; height:90px; margin-left:-23px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 80%, rgba(255,255,255,.32), rgba(255,255,255,0) 70%);
    filter:blur(9px); opacity:0; z-index:3; animation:steam 3.2s ease-in-out infinite; }
  .steam.s2 { margin-left:-48px; animation-delay:.9s; width:36px; }
  .steam.s3 { margin-left:4px; animation-delay:1.7s; width:40px; }
  @keyframes steam {
    0%   { opacity:0; transform:translateY(20px) scaleX(.8); }
    30%  { opacity:.9; }
    100% { opacity:0; transform:translateY(-70px) scaleX(1.5); }
  }

  /* ---------- text ---------- */
  .copy { position:relative; z-index:5; display:flex; flex-direction:column; align-items:center; width:100%; margin-top:22px; }
  .greet { font-size:.9rem; font-weight:300; color:#b9c9ee; letter-spacing:.04em; opacity:0; transform:translateY(8px);
    animation:up .5s ease .75s forwards; }
  .name { margin-top:6px; font-family:'Playfair Display', serif; font-weight:800; line-height:1.04; text-align:center;
    font-size:clamp(2.5rem, 12.5vw, 4.4rem); display:flex; flex-direction:column; align-items:center; }
  .name .w { display:flex; }
  .name .l { display:inline-block; opacity:0; transform:translateY(34px) rotate(6deg); filter:blur(6px);
    background:linear-gradient(180deg, var(--gold-hi) 10%, var(--gold) 55%, var(--brass) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:letter .55s cubic-bezier(.2,1.2,.3,1) forwards; animation-delay:var(--d); }
  @keyframes letter { to { opacity:1; transform:none; filter:blur(0); } }

  .tagline { margin-top:12px; font-family:'Playfair Display', serif; font-style:italic; font-weight:500; font-size:1.08rem;
    color:var(--cream); text-align:center; padding:0 12px; opacity:0; transform:translateY(8px); animation:up .6s ease 1.35s forwards; }
  @keyframes up { to { opacity:1; transform:none; } }

  /* ---------- table plaque: the one memorable moment ---------- */
  .plaque { position:relative; margin-top:26px; display:flex; align-items:center; gap:14px; padding:10px 24px 10px 12px;
    border-radius:18px; opacity:0; transform:scale(1.7) rotate(-5deg);
    background:linear-gradient(180deg, #17294d, #0c1730);
    border:1.5px solid var(--gold);
    box-shadow:0 0 0 4px rgba(242,181,63,.12), 0 10px 30px rgba(0,0,0,.55), 0 0 36px rgba(242,181,63,.35), inset 0 1px 0 rgba(255,227,160,.4);
    animation:stamp .5s cubic-bezier(.2,1.4,.3,1) 1.65s forwards; }
  .plaque::after { content:''; position:absolute; inset:-2px; border-radius:20px; border:2px solid var(--gold); opacity:0;
    animation:ripple .9s ease-out 1.75s forwards; }
  .plaque .no { min-width:58px; height:58px; border-radius:12px; display:grid; place-items:center; padding:0 10px;
    font-family:'Playfair Display', serif; font-weight:800; font-size:2rem; color:#2a1a02;
    background:linear-gradient(145deg, var(--gold-hi), var(--gold) 55%, var(--brass)); box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
  .plaque .txt { display:flex; flex-direction:column; line-height:1.2; }
  .plaque .txt b { font-weight:600; font-size:1.05rem; color:#fff; }
  .plaque .txt span { font-weight:300; font-size:.82rem; color:#b9c9ee; }
  @keyframes stamp { to { opacity:1; transform:none; } }
  @keyframes ripple { 0% { opacity:.9; transform:scale(1); } 100% { opacity:0; transform:scale(1.4, 1.9); } }

  .seat { margin-top:24px; padding:10px 22px; border-radius:40px; font-size:.95rem; font-weight:400; color:var(--cream);
    border:1px solid rgba(242,181,63,.6); background:rgba(242,181,63,.1); opacity:0; transform:translateY(10px);
    animation:up .6s ease 1.65s forwards; }

  /* ---------- footer ---------- */
  .skip { position:absolute; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom)); text-align:center; z-index:8;
    font-size:.78rem; font-weight:300; color:#8da2d1; opacity:0; animation:fade .5s ease 1.2s forwards; }
  .bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.07); z-index:9; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--coral), var(--gold), var(--gold-hi));
    box-shadow:0 0 12px var(--gold); animation:fill 2.7s cubic-bezier(.3,.1,.3,1) forwards; }
  @keyframes fill { to { width:100%; } }

  @media (max-height:620px) { .medal { width:132px; height:132px; } .logo { inset:16px; } .copy { margin-top:12px; }
    .plaque { margin-top:16px; } .tagline { margin-top:8px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
    .steam { display:none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage" role="button" aria-label="Skip welcome and open the menu" onclick="go()">
  <div class="glow"></div>
  <canvas id="fx"></canvas>

  <div class="medal" id="medal">
    <span class="steam"></span><span class="steam s2"></span><span class="steam s3"></span>
    <svg viewBox="0 0 168 168" aria-hidden="true">
      <circle class="ring-dash" cx="84" cy="84" r="80"/>
      <circle class="ring-draw" cx="84" cy="84" r="72"/>
    </svg>
    <!-- If static/images/logo.png is missing on the server, a plate icon is shown instead -->
    <div class="logo" id="logoBox">
      <img src="{% static 'images/logo.png' %}" alt="Chandru Restaurant"
           onerror="this.onerror=null; this.style.display='none'; document.getElementById('logoBox').classList.add('nologo');">
    </div>
  </div>

  <div class="copy">
    <div class="greet" id="greet">Welcome to</div>
    <div class="name" id="name" aria-label="Chandru Restaurant"></div>
    <div class="tagline">Fresh, hot and made for you</div>

    {% if table_no %}
    <div class="plaque" id="plaque">
      <div class="no">{{ table_no }}</div>
      <div class="txt"><b>Table {{ table_no }}</b><span>Your table is ready</span></div>
    </div>
    {% else %}
    <div class="seat" id="plaque">Pick a seat and explore our menu</div>
    {% endif %}
  </div>

  <div class="skip">Tap anywhere to skip</div>
  <div class="bar"><i></i></div>
  <div class="vig"></div>
</div>

<script>
(function () {
  var HOME = "{{ home_url|default:'/'|escapejs }}";
  var NAME = "Chandru Restaurant";
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done = false;
  var $ = function (id) { return document.getElementById(id); };

  window.go = function () {
    if (done) return;
    done = true;
    $('stage').classList.add('leave');
    setTimeout(function () { location.replace(HOME); }, 320);
  };

  /* greeting by local time */
  var h = new Date().getHours();
  $('greet').textContent = (h < 12 ? 'Good morning, welcome to' : h < 17 ? 'Good afternoon, welcome to' : h < 21 ? 'Good evening, welcome to' : 'Welcome to');

  /* name: one word per line, letters rise one by one */
  var idx = 0;
  NAME.split(' ').forEach(function (word) {
    var w = document.createElement('span');
    w.className = 'w';
    word.split('').forEach(function (ch) {
      var s = document.createElement('span');
      s.className = 'l';
      s.textContent = ch;
      s.style.setProperty('--d', (0.85 + idx * 0.035) + 's');
      idx++;
      w.appendChild(s);
    });
    $('name').appendChild(w);
  });

  if (REDUCED) { setTimeout(go, 900); return; }

  /* drifting gold dust + one spark burst when the table plaque lands */
  var cv = $('fx'), ctx = cv.getContext('2d'), W, H;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
  size();
  addEventListener('resize', size);

  var dust = [], sparks = [];
  for (var i = 0; i < 38; i++) {
    dust.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight,
                r: 0.6 + Math.random() * 1.8, v: 0.15 + Math.random() * 0.5, a: 0.15 + Math.random() * 0.5,
                s: Math.random() * 6.28 });
  }

  function burst() {
    var el = $('plaque');
    if (!el) return;
    var r = el.getBoundingClientRect();
    var ox = (r.left + r.width / 2) * dpr, oy = (r.top + r.height / 2) * dpr;
    for (var i = 0; i < 46; i++) {
      var a = Math.random() * 6.283, sp = (2 + Math.random() * 7) * dpr;
      sparks.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5 * dpr, g: 0.1 * dpr,
                    r: (1 + Math.random() * 2.2) * dpr, life: 1, decay: 0.017 + Math.random() * 0.02 });
    }
  }

  var t = 0;
  (function frame() {
    if (done && sparks.length === 0) return;
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    ctx.shadowBlur = 0;
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      d.y -= d.v; d.x += Math.sin(t + d.s) * 0.25;
      if (d.y < -4) { d.y = innerHeight + 4; d.x = Math.random() * innerWidth; }
      ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * 2 + d.s));
      ctx.fillStyle = '#ffe3a0';
      ctx.beginPath(); ctx.arc(d.x * dpr, d.y * dpr, d.r * dpr, 0, 6.283); ctx.fill();
    }

    ctx.shadowColor = 'rgba(255,200,90,.9)'; ctx.shadowBlur = 10 * dpr;
    for (var j = sparks.length - 1; j >= 0; j--) {
      var p = sparks[j];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.985; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(j, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = j % 3 === 0 ? '#ff8a66' : '#ffd36b';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  })();

  setTimeout(function () { burst(); if (navigator.vibrate) navigator.vibrate([20, 30, 20]); }, 1850);

  setTimeout(go, 2800);   // about 2.8 seconds in total, then the home page
})();
</script>
</body>
</html>
