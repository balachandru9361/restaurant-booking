{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b19">
<title>Welcome – Chandru Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#f5b335; --gold2:#ffe29a; --coral:#ff6b4a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#050b19; font-family:'Poppins',sans-serif; color:#fff; }

  .stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
    background: radial-gradient(ellipse at 50% 30%, #1c3263 0%, #0b1836 45%, #040916 100%);
    transition: opacity .3s ease, transform .3s ease, filter .3s ease; }
  .stage.leave { opacity:0; transform:scale(1.18); filter:blur(6px) brightness(1.5); }

  .spot { position:absolute; inset:0; opacity:0; animation: fade .3s ease forwards;
    background: conic-gradient(from 180deg at 50% -8%, transparent 158deg, rgba(255,226,154,.2) 174deg, rgba(255,226,154,.2) 186deg, transparent 202deg); }
  .vig { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%); pointer-events:none; z-index:6; }
  .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.45; }
  .o1 { width:320px; height:320px; background:#ff6b4a66; top:-90px; left:-100px; }
  .o2 { width:360px; height:360px; background:#f5b33550; bottom:-120px; right:-110px; }
  canvas#fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  .flash { position:absolute; inset:0; z-index:7; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 38%, #fff 0%, rgba(255,226,154,.85) 25%, transparent 65%); animation: flash .5s ease .38s forwards; }
  @keyframes flash { 0%{opacity:0} 25%{opacity:.9} 100%{opacity:0} }

  .scene { position:relative; width:min(310px,82vw); height:270px; z-index:4; }
  .scene > * { position:absolute; left:50%; }
  .rays { top:128px; width:720px; height:720px; margin:-360px 0 0 -360px; border-radius:50%; opacity:0;
    background:repeating-conic-gradient(from 0deg, rgba(255,214,120,.30) 0 7deg, transparent 7deg 22deg);
    -webkit-mask:radial-gradient(circle, #000 0%, transparent 62%); mask:radial-gradient(circle, #000 0%, transparent 62%);
    animation: fade .4s ease .4s forwards, spin 12s linear .4s infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .halo { top:128px; width:260px; height:260px; margin:-130px 0 0 -130px; border-radius:50%; opacity:0;
    background:radial-gradient(circle, rgba(255,200,90,.55), transparent 68%); animation: fade .4s ease .45s forwards; }

  .plate { bottom:0; width:100%; margin-left:-50%; opacity:0; animation: plateIn .3s cubic-bezier(.2,1.2,.4,1) 0s forwards; z-index:1; filter:drop-shadow(0 18px 24px rgba(0,0,0,.6)); }
  @keyframes plateIn { from{opacity:0; transform:translateY(30px) scale(.85);} to{opacity:1; transform:none;} }

  .logo { top:128px; width:124px; height:124px; margin:-62px 0 0 -62px; z-index:2; opacity:0; animation: logoRise .55s cubic-bezier(.2,1.6,.35,1) .42s forwards; }
  @keyframes logoRise { from{opacity:0; transform:translateY(60px) scale(.35);} to{opacity:1; transform:translateY(-6px) scale(1);} }
  .logo img { width:100%; height:100%; border-radius:50%; object-fit:cover; background:#fff; border:3px solid var(--gold);
    box-shadow:0 0 0 7px rgba(245,179,53,.14), 0 0 45px rgba(245,179,53,.85), 0 0 120px rgba(245,179,53,.35); }

  .cloche { bottom:34px; width:100%; margin-left:-50%; z-index:3; opacity:0; transform-origin:50% 100%;
    animation: clocheIn .28s cubic-bezier(.3,1.3,.5,1) .03s forwards, clocheLift .4s cubic-bezier(.6,0,.25,1) .34s forwards;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  @keyframes clocheIn { from{opacity:0; transform:translateY(-200px);} to{opacity:1; transform:none;} }
  @keyframes clocheLift { from{opacity:1; transform:none;} to{opacity:0; transform:translateY(-220px) rotate(-16deg);} }

  .text { z-index:5; display:flex; flex-direction:column; align-items:center; margin-top:4px; width:100%; }
  .greet { font-size:.72rem; letter-spacing:.4em; color:#a9bce3; font-weight:500; text-align:center; padding:0 12px; opacity:0; transform:translateY(10px); animation: up .35s ease .4s forwards; }
  .name { margin-top:8px; font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(2.1rem,9.5vw,3.7rem);
    text-align:center; line-height:1.08; padding:0 14px; display:flex; flex-wrap:wrap; justify-content:center; perspective:600px; }
  .name .w { display:inline-flex; white-space:nowrap; margin:0 .14em; }
  .name .l { display:inline-block; opacity:0; transform:translateY(40px) scale(.5) rotateX(90deg); filter:blur(8px);
    background:linear-gradient(110deg,#ffcf6b 20%,#fff9dc 45%,#f5a623 70%); background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: letter .4s cubic-bezier(.2,1.3,.3,1) forwards; animation-delay:var(--d); }
  @keyframes letter { to { opacity:1; transform:none; filter:blur(0); } }
  .divider { margin-top:10px; height:14px; display:flex; align-items:center; gap:10px; color:var(--gold); font-size:.7rem; opacity:0; animation: fade .3s ease .75s forwards; }
  .divider i { display:block; height:1px; width:0; background:linear-gradient(90deg,transparent,var(--gold)); animation: line .4s ease .75s forwards; }
  .divider i:last-child { background:linear-gradient(270deg,transparent,var(--gold)); }
  @keyframes line { to { width:70px; } }
  .tag { margin-top:10px; color:#dbe5fb; font-size:.98rem; font-weight:300; text-align:center; padding:0 22px; opacity:0; transform:translateY(10px); animation: up .35s ease .8s forwards; }
  .tag b { color:var(--gold2); font-weight:500; }
  .chip { margin-top:14px; padding:8px 20px; border-radius:40px; opacity:0; font-size:.9rem; font-weight:500;
    background:linear-gradient(135deg,rgba(255,107,74,.28),rgba(245,179,53,.22)); border:1px solid rgba(255,170,130,.7); color:#ffe0d3;
    box-shadow:0 0 28px rgba(255,107,74,.35); animation: bounce .4s cubic-bezier(.2,1.7,.4,1) .9s forwards; }
  @keyframes up { to { opacity:1; transform:none; } }
  @keyframes bounce { from{opacity:0; transform:translateY(20px) scale(.5);} to{opacity:1; transform:none;} }
  @keyframes fade { to { opacity:1; } }

  .bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.08); z-index:8; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--coral),var(--gold),var(--gold2)); box-shadow:0 0 12px var(--gold); animation: fill 1.3s ease-out forwards; }
  @keyframes fill { to { width:100%; } }

  @media (max-height:640px) { .scene { height:230px; transform:scale(.85); margin-bottom:-20px; } }
</style>
</head>
<body>
<div class="stage" id="stage" onclick="go()">
  <div class="spot"></div>
  <div class="orb o1"></div><div class="orb o2"></div>
  <canvas id="fx"></canvas>

  <div class="scene">
    <div class="rays"></div>
    <div class="halo"></div>

    <svg class="plate" viewBox="0 0 310 70" aria-hidden="true">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#8c97ad"/></linearGradient>
        <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab4c8"/><stop offset="1" stop-color="#e9edf5"/></linearGradient>
      </defs>
      <ellipse cx="155" cy="38" rx="150" ry="28" fill="url(#pg)"/>
      <ellipse cx="155" cy="34" rx="118" ry="19" fill="url(#pg2)"/>
      <ellipse cx="155" cy="33" rx="96" ry="14" fill="none" stroke="#f5b335" stroke-width="1.4" opacity=".8"/>
    </svg>

    <!-- Login animation-la use pannura same logo path inga podunga -->
    <div class="logo"><img src="{% static 'images/logo.png' %}" alt="Chandru Restaurant"></div>

    <svg class="cloche" viewBox="0 0 310 200" aria-hidden="true">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7d889e"/><stop offset=".25" stop-color="#f2f5fb"/><stop offset=".5" stop-color="#b9c2d4"/><stop offset=".8" stop-color="#e8ecf5"/><stop offset="1" stop-color="#7d889e"/>
        </linearGradient>
      </defs>
      <path d="M30 170 C30 40 280 40 280 170 Z" fill="url(#cg)"/>
      <path d="M62 150 C66 92 110 66 150 62" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55"/>
      <rect x="18" y="166" width="274" height="12" rx="6" fill="url(#cg)"/>
      <circle cx="155" cy="53" r="11" fill="url(#cg)"/><rect x="149" y="56" width="12" height="9" fill="#9aa5ba"/>
      <circle cx="152" cy="50" r="3.5" fill="#fff" opacity=".8"/>
    </svg>
  </div>

  <div class="text">
    <div class="greet" id="greet">WELCOME TO</div>
    <div class="name" id="name"></div>
    <div class="divider"><i></i>◆<i></i></div>
    <div class="tag">Hungry? Let's find something <b>delicious</b> 🍽️</div>
    {% if table_no %}<div class="chip">🪑 Table {{ table_no }}</div>{% endif %}
  </div>

  <div class="bar"><i></i></div>
  <div class="flash"></div>
  <div class="vig"></div>
</div>

<script>
(function () {
  var HOME = "{{ home_url|default:'/' }}";
  var NAME = "Chandru Restaurant";
  var done = false;
  var $ = function (id) { return document.getElementById(id); };

  window.go = function () {
    if (done) return; done = true;
    $('stage').classList.add('leave');
    setTimeout(function () { location.replace(HOME); }, 280);
  };

  var h = new Date().getHours();
  $('greet').textContent = (h < 12 ? 'GOOD MORNING' : h < 17 ? 'GOOD AFTERNOON' : h < 21 ? 'GOOD EVENING' : 'HELLO') + ' · WELCOME TO';

  var idx = 0;
  NAME.split(' ').forEach(function (word) {
    var w = document.createElement('span'); w.className = 'w';
    word.split('').forEach(function (ch) {
      var s = document.createElement('span'); s.className = 'l'; s.textContent = ch;
      s.style.setProperty('--d', (0.42 + idx * 0.02) + 's'); idx++;
      w.appendChild(s);
    });
    $('name').appendChild(w);
  });

  /* canvas sparks + food emoji burst */
  var cv = $('fx'), ctx = cv.getContext('2d'), W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
  size(); addEventListener('resize', size);
  var EM = ['🍕','🍔','🍗','🍛','🍜','🍰','🥗','🍟','🌮','🍤','🥘','🧁'];
  var P = [];
  function burst(n) {
    var r = document.querySelector('.logo').getBoundingClientRect();
    var ox = (r.left + r.width / 2) * dpr, oy = (r.top + r.height / 2) * dpr;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (4 + Math.random() * 9) * dpr;
      P.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.5 * dpr, g: .12 * dpr,
               r: (1.5 + Math.random() * 2.6) * dpr, life: 1, decay: .014 + Math.random() * .014,
               e: i % 3 === 0 ? EM[Math.floor(Math.random() * EM.length)] : null,
               rot: Math.random() * 6, vr: (Math.random() - .5) * .3, sz: (20 + Math.random() * 18) * dpr,
               hue: Math.random() < .5 ? '255,205,95' : '255,120,90' });
    }
  }
  (function frame() {
    ctx.clearRect(0, 0, W, H);
    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.life -= p.decay;
      if (p.life <= 0) { P.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      if (p.e) {
        p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.font = p.sz + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.e, 0, 0); ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(' + p.hue + ',1)'; ctx.shadowColor = 'rgba(255,200,90,.9)'; ctx.shadowBlur = 10 * dpr;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  })();

  setTimeout(function () { burst(60); if (navigator.vibrate) navigator.vibrate([25, 30, 25]); }, 400); // cloche lifts
  setTimeout(function () { burst(30); }, 850);                                                          // name done

  setTimeout(go, 1200);   // total = ~1.5 sec, then home page
})();
</script>
</body>
</html>
