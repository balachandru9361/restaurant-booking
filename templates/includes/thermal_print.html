{% comment %}
  Save as: templates/includes/thermal_print.html
  Include inside {% block admin_content %} of kitchen.html, manage_orders.html, etc:
      {% include "includes/thermal_print.html" %}
  Then call printThermal({...}) from any print button.
{% endcomment %}
{% verbatim %}

<script type="text/plain" id="thermal-css">
  @page { size: __PAPER__ auto; margin: 0; }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #fff; }

  body {
    width: __PAPER__;
    padding: 3mm 4mm 10mm;
    font-family: "Courier New", Courier, monospace;
    font-size: 12px;
    line-height: 1.35;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body.p58 { padding: 2mm 2mm 10mm; font-size: 11px; }
  body.p58 .target { font-size: 18px; }
  body.p58 .kitem { font-size: 13px; }

  /* One ticket per copy */
  .ticket { page-break-after: always; }
  .ticket:last-child { page-break-after: auto; }

  .c   { text-align: center; }
  .b   { font-weight: 700; }
  .big { font-size: 17px; letter-spacing: 0.5px; }
  .sub { font-size: 13px; font-weight: 700; letter-spacing: 2px; margin-top: 2px; }
  .small { font-size: 10.5px; }

  .hr { border-top: 1px dashed #000; margin: 6px 0; }

  .row { display: flex; justify-content: space-between; gap: 6px; }
  .meta { font-size: 11px; }

  .target {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    margin: 6px 0;
    padding: 4px 0;
    border: 2px solid #000;
    letter-spacing: 1px;
  }

  /* Kitchen */
  .kitem { font-size: 16px; font-weight: 800; margin: 5px 0; word-break: break-word; }
  .count { font-size: 13px; font-weight: 800; text-align: right; }
  .note  { font-size: 13px; font-weight: 700; margin-top: 4px; border: 1px dashed #000; padding: 3px 4px; }

  /* Bill */
  .item { font-weight: 700; margin-top: 4px; word-break: break-word; }
  .line { font-size: 12px; }
  .total { font-size: 16px; font-weight: 800; padding: 2px 0; }
  .thanks { text-align: center; margin-top: 4px; }
</script>

<script>
(function () {
  // ================= SETTINGS =================
  var PAPER_MM     = 58;                       // 80 for 80mm rolls, 58 for 58mm rolls
  var RESTAURANT   = 'CHANDRU RESTAURANT';
  var ADDRESS      = '';                       // e.g. 'Anna Nagar, Chennai'  (empty = hidden)
  var PHONE        = '';                       // e.g. '98765 43210'          (empty = hidden)
  var GSTIN        = '';                       // e.g. '33ABCDE1234F1Z5'      (empty = hidden)
  var GST_PERCENT  = 0;                        // 0 = hide. Use 5 if prices already include 5% GST
  var CURRENCY     = 'Rs.';
  var BILL_FOOTER  = 'Thank you! Visit again';
  var BILL_COPIES  = 1;                        // how many copies of a bill to print
  var KITCHEN_COPIES = 1;                      // how many copies of a kitchen ticket
  // ============================================

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) {
    var v = parseFloat(n);
    return isNaN(v) ? '0.00' : v.toFixed(2);
  }
  function nowText() {
    try {
      return new Date().toLocaleString('en-IN', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    } catch (e) { return new Date().toLocaleString(); }
  }

  /*
    printThermal({
      type:     'kitchen' | 'bill',
      orderId:  406,
      target:   'TABLE 17' | 'TAKEAWAY',
      customer: 'server@01',
      items:    [{ name: 'Mutton Pepper Fry', qty: 3, price: 1500 }],
      total:    '4500.00',      // bill: final amount
      discount: '100.00',       // bill: optional
      payment:  'Cash Paid',    // bill: optional text
      note:     'Less spicy'    // kitchen: optional
    })
  */
  function buildTicket(o) {
    var isBill = o.type === 'bill';
    var items = o.items || [];
    var out = '<div class="ticket">';

    // ---- Header ----
    out += '<div class="c b big">' + esc(RESTAURANT) + '</div>';
    if (isBill && ADDRESS) out += '<div class="c small">' + esc(ADDRESS) + '</div>';
    if (isBill && PHONE)   out += '<div class="c small">Ph: ' + esc(PHONE) + '</div>';
    if (isBill && GSTIN)   out += '<div class="c small">GSTIN: ' + esc(GSTIN) + '</div>';
    out += '<div class="c sub">' + (isBill ? 'BILL' : 'KITCHEN TICKET') + '</div>';
    out += '<div class="hr"></div>';

    // ---- Order info ----
    out += '<div class="meta b">Order #' + esc(o.orderId) + '</div>';
    out += '<div class="meta">' + esc(nowText()) + '</div>';
    if (o.customer) out += '<div class="meta">' + (isBill ? 'Customer: ' : 'By: ') + esc(o.customer) + '</div>';
    out += '<div class="target">' + esc(o.target || '') + '</div>';
    if (o.arrival) out += '<div class="meta b">Arrival: ' + esc(o.arrival) + '</div>';
    out += '<div class="hr"></div>';

    // ---- Items ----
    var subtotal = 0, totalQty = 0;
    items.forEach(function (it) {
      var qty = Number(it.qty) || 0;
      var price = parseFloat(it.price) || 0;
      totalQty += qty;
      subtotal += qty * price;
      if (isBill) {
        out += '<div class="item">' + esc(it.name) + '</div>' +
               '<div class="row line"><span>' + qty + ' x ' + money(price) + '</span><span>' + money(qty * price) + '</span></div>';
      } else {
        out += '<div class="kitem">' + qty + ' x ' + esc(it.name) + '</div>';
      }
    });
    out += '<div class="hr"></div>';

    if (!isBill) {
      // ---- Kitchen extras ----
      out += '<div class="count">TOTAL ITEMS: ' + totalQty + '</div>';
      if (o.note) out += '<div class="note">NOTE: ' + esc(o.note) + '</div>';
    } else {
      // ---- Bill totals ----
      var discount = parseFloat(o.discount) || 0;
      var total = (o.total !== undefined && o.total !== '' && !isNaN(parseFloat(o.total)))
        ? parseFloat(o.total) : (subtotal - discount);

      if (discount > 0) {
        out += '<div class="row line"><span>Subtotal</span><span>' + money(subtotal) + '</span></div>';
        out += '<div class="row line"><span>Discount</span><span>-' + money(discount) + '</span></div>';
      }
      out += '<div class="row total"><span>TOTAL</span><span>' + esc(CURRENCY) + ' ' + money(total) + '</span></div>';

      if (GST_PERCENT > 0) {
        var base = total / (1 + GST_PERCENT / 100);
        out += '<div class="row meta"><span>Incl. GST ' + GST_PERCENT + '%</span><span>' + money(total - base) + '</span></div>';
      }
      if (o.payment) out += '<div class="meta b" style="margin-top:3px;">Payment: ' + esc(o.payment) + '</div>';

      out += '<div class="hr"></div><div class="thanks">' + esc(BILL_FOOTER) + '</div>';
    }

    out += '</div>';
    return out;
  }

  window.printThermal = function (o) {
    o = o || {};
    window.thermalPrinting = true;   // lets auto-refreshing pages pause while printing

    var isBill = o.type === 'bill';
    var paperW = PAPER_MM === 58 ? '58mm' : '80mm';
    var bodyClass = PAPER_MM === 58 ? 'p58' : 'p80';
    var copies = Math.max(1, (isBill ? BILL_COPIES : KITCHEN_COPIES) | 0);

    var cssEl = document.getElementById('thermal-css');
    var css = (cssEl ? cssEl.textContent : '').replace(/__PAPER__/g, paperW);

    var body = '';
    for (var i = 0; i < copies; i++) body += buildTicket(o);

    var html =
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Order ' + esc(o.orderId) + '</title>' +
      '<style>' + css + '</style></head><body class="' + bodyClass + '">' + body + '</body></html>';

    var frame = document.createElement('iframe');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    document.body.appendChild(frame);

    var w = frame.contentWindow;
    w.document.open();
    w.document.write(html);
    w.document.close();

    setTimeout(function () {
      try { w.focus(); w.print(); } catch (e) { /* user cancelled or blocked */ }
      setTimeout(function () { frame.remove(); window.thermalPrinting = false; }, 1500);
    }, 300);
  };
})();
</script>
{% endverbatim %}
